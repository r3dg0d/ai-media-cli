[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-media-cli"
version = "0.1.0"
description = "Local-first AI media CLI suite: Qwen image, TRELLIS 3D, 3dai, editvideo"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Vincent", email = "r3dg0d@users.noreply.github.com" }]
keywords = ["ai", "cli", "image-generation", "qwen", "trellis", "terminal"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "rich>=13.7",
  "tomli>=2.0; python_version < '3.11'",
  "tomli-w>=1.0",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
qwen = [
  "torch>=2.4",
  "transformers>=5.17",
  "diffusers>=0.31",
  "accelerate>=0.34",
]
trellis = []
all = ["ai-media-cli[qwen,trellis,dev]"]

[project.scripts]
text2img = "ai_media.qwen.text2img:main"
img2img = "ai_media.qwen.img2img:main"
3dai = "ai_media.threedai.cli:main"
editvideo = "ai_media.editvideo.cli:main"
ai-media = "ai_media.shared.diagnostics:main"

[project.urls]
Homepage = "https://github.com/r3dg0d/ai-media-cli"
Repository = "https://github.com/r3dg0d/ai-media-cli"
Issues = "https://github.com/r3dg0d/ai-media-cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_media"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.sdist]
include = ["src/ai_media", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
